<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myanmar Tech & AI Chatbot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0e1a 0%, #0d1b2e 50%, #0a1628 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Segoe UI', 'Noto Sans Myanmar', sans-serif;
    padding: 16px;
  }
  .chat-container {
    width: 100%; max-width: 680px;
    height: 90vh; max-height: 780px;
    display: flex; flex-direction: column;
  }
  .header {
    background: linear-gradient(135deg, rgba(0,140,255,0.15), rgba(80,40,200,0.15));
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    padding: 18px 24px;
    display: flex; align-items: center; gap: 14px;
  }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(135deg, #00a8ff, #6644ee);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    box-shadow: 0 0 20px rgba(0,168,255,0.4);
  }
  .header-info { flex: 1; }
  .header-title { color: #fff; font-weight: 700; font-size: 16px; }
  .header-sub { color: rgba(255,255,255,0.5); font-size: 12px; }
  .live-badge {
    background: rgba(0,255,120,0.15); color: #00ff88;
    border: 1px solid rgba(0,255,120,0.3);
    border-radius: 20px; padding: 4px 12px;
    font-size: 11px; font-weight: 600;
  }
  .messages {
    flex: 1; overflow-y: auto;
    background: rgba(6,12,26,0.95);
    border: 1px solid rgba(255,255,255,0.07);
    border-top: 1px solid rgba(0,140,255,0.2);
    border-bottom: none;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .msg-row { display: flex; align-items: flex-end; gap: 8px; }
  .msg-row.user { justify-content: flex-end; }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
  }
  .msg-avatar.bot { background: linear-gradient(135deg, #00a8ff, #6644ee); box-shadow: 0 0 10px rgba(0,168,255,0.3); }
  .msg-avatar.user-av { background: rgba(255,255,255,0.1); }
  .bubble {
    max-width: 75%; padding: 12px 16px;
    color: #fff; font-size: 14px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
  }
  .bubble.bot {
    border-radius: 18px 18px 18px 4px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .bubble.user {
    border-radius: 18px 18px 4px 18px;
    background: linear-gradient(135deg, #0078ff, #5040dd);
    box-shadow: 0 4px 20px rgba(0,120,255,0.3);
  }
  .typing { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #00a8ff;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }
  .suggestions {
    background: rgba(6,12,26,0.95);
    border-left: 1px solid rgba(255,255,255,0.07);
    border-right: 1px solid rgba(255,255,255,0.07);
    padding: 10px 16px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .suggest-btn {
    background: rgba(0,140,255,0.1);
    border: 1px solid rgba(0,140,255,0.25);
    color: #7ec8ff; border-radius: 20px;
    padding: 6px 14px; font-size: 12px;
    cursor: pointer; transition: all 0.2s;
    font-family: inherit;
  }
  .suggest-btn:hover { background: rgba(0,140,255,0.2); color: #fff; }
  .input-area {
    background: rgba(10,18,35,0.98);
    border: 1px solid rgba(255,255,255,0.1);
    border-top: 1px solid rgba(0,140,255,0.2);
    border-radius: 0 0 20px 20px;
    padding: 14px 16px;
    display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; color: #fff;
    padding: 12px 16px; font-size: 14px;
    resize: none; outline: none;
    font-family: inherit; line-height: 1.5;
    max-height: 100px; overflow-y: auto;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: rgba(0,140,255,0.5); }
  textarea::placeholder { color: rgba(255,255,255,0.3); }
  #send-btn {
    width: 46px; height: 46px; border-radius: 12px;
    border: none; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
    background: rgba(255,255,255,0.05); color: #fff;
  }
  #send-btn.active {
    background: linear-gradient(135deg, #0078ff, #5040dd);
    box-shadow: 0 4px 15px rgba(0,120,255,0.4);
  }
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <div class="avatar">🤖</div>
    <div class="header-info">
      <div class="header-title">Myanmar Tech & AI</div>
      <div class="header-sub">🟢 AI Assistant • t.me/MyanmarTechAi</div>
    </div>
    <span class="live-badge">LIVE</span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="suggestions" id="suggestions">
    <button class="suggest-btn" onclick="sendMsg('ChatGPT နဲ့ Claude ကွာခြားချက်ကဘာလဲ?')">ChatGPT နဲ့ Claude ကွာခြားချက်?</button>
    <button class="suggest-btn" onclick="sendMsg('Free AI tools တွေ ဘာတွေရှိလဲ?')">Free AI tools?</button>
    <button class="suggest-btn" onclick="sendMsg('Phone ကို faster လုပ်ဖို့ tips တွေပေးပါ')">Phone faster tips</button>
  </div>

  <div class="input-area">
    <textarea id="input" rows="1" placeholder="မေးချင်တာ ရေးပါ... (Enter ပို့ရန်)"></textarea>
    <button id="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
const SYSTEM = `You are the official AI assistant for "Myanmar Tech & AI" Telegram channel (t.me/MyanmarTechAi).
You are helpful, friendly, and knowledgeable about AI news, tech tips, apps, and tools.
Language: Reply in the SAME language the user writes in. Mix both if they mix.
Personality: Be friendly, use relevant emojis occasionally, keep answers practical.
Always mention t.me/MyanmarTechAi when relevant. Keep responses concise but informative.`;

let history = [];
let loading = false;

function addMsg(role, text) {
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : '');
  if (role === 'assistant') {
    row.innerHTML = `<div class="msg-avatar bot">🤖</div><div class="bubble bot">${text}</div>`;
  } else {
    row.innerHTML = `<div class="bubble user">${text}</div><div class="msg-avatar user-av">👤</div>`;
  }
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return row;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row'; row.id = 'typing';
  row.innerHTML = `<div class="msg-avatar bot">🤖</div><div class="bubble bot"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendMsg(text) {
  const input = document.getElementById('input');
  const msg = text || input.value.trim();
  if (!msg || loading) return;
  loading = true;
  input.value = '';
  document.getElementById('suggestions').style.display = 'none';
  updateBtn();
  addMsg('user', msg);
  history.push({ role: 'user', content: msg });
  showTyping();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM,
        messages: history
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'တစ်ခုခု မှားယွင်းသွားပါတယ်။';
    document.getElementById('typing')?.remove();
    addMsg('assistant', reply);
    history.push({ role: 'assistant', content: reply });
  } catch(e) {
    document.getElementById('typing')?.remove();
    addMsg('assistant', '❌ Error ဖြစ်သွားပါတယ်။ ထပ်ကြိုးစားပါ။');
  }
  loading = false;
  updateBtn();
}

function updateBtn() {
  const btn = document.getElementById('send-btn');
  const val = document.getElementById('input').value.trim();
  btn.className = val && !loading ? 'active' : '';
  btn.textContent = loading ? '⏳' : '➤';
}

document.getElementById('input').addEventListener('input', updateBtn);
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

// Welcome message
addMsg('assistant', 'မင်္ဂလာပါ! 👋 Myanmar Tech & AI Channel ရဲ့ AI Assistant ပါ။\n\nAI သတင်းများ၊ Tech Tips၊ App/Tool အကြောင်းများ မေးနိုင်ပါတယ်! 🤖\n\nမြန်မာလို သို့မဟုတ် English နှစ်မျိုးလုံး ဖြေပေးနိုင်ပါတယ်။');
</script>
</body>
  </html>
